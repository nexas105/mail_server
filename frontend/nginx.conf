# nginx für das Frontend: statische Dateien aus dist/ + Proxy für /api an das
# Backend (Dienstname „backend" aus docker-compose.yml).
#
# TLS/HSTS werden hier NICHT gesetzt: davor gehört ein TLS-Reverse-Proxy
# (Caddy/Traefik/nginx), der https terminiert und Strict-Transport-Security
# setzt. Das Backend setzt HSTS selbst, sobald X-Forwarded-Proto=https ankommt.

# Die CSP als Variable, damit sie in mehreren locations identisch bleibt.
# Direktiven exakt wie in backend/src/server.js (Block „Sicherheits-Header").
# Hinter einem weiteren Proxy (Coolify/Traefik) kommt das Protokoll als
# X-Forwarded-Proto an – das reichen wir durch, sonst sähe das Backend „http"
# und würde Cookies ohne Secure-Flag setzen.
map $http_x_forwarded_proto $mail_fwd_proto {
    default $scheme;
    https   https;
    http    http;
}

map $host $mail_csp {
    default "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' blob:; connect-src 'self'; frame-src 'self' blob:";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads (Anhänge/Assets) kommen als JSON mit base64 bis 30 MB → etwas Luft.
    client_max_body_size 40m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # ---- API → Backend ------------------------------------------------------
    # Sicherheits-Header setzt hier das Backend selbst (Express), darum kein
    # add_header in diesem Block.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $mail_fwd_proto;
        proxy_set_header Connection "";

        # Server-Sent Events (/api/whatsapp/stream, /api/drafts/*/send):
        # nicht puffern, nicht cachen, lange Leitung offen halten.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # ---- Statisches Frontend ------------------------------------------------
    # Achtung: add_header in einem location ERSETZT die Header des server-Blocks
    # (keine Vererbung). Darum stehen die Sicherheits-Header in jedem location
    # vollständig. Vorher hat Express diese Header für die UI gesetzt.

    # Gehashte Build-Artefakte: lange cachen.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Content-Security-Policy $mail_csp always;
        try_files $uri =404;
    }

    # SPA-Fallback: alles Übrige auf index.html, die nie gecacht wird.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Content-Security-Policy $mail_csp always;
        try_files $uri /index.html;
    }
}
